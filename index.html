        function PhonemeTypingPractice({ strings = {
            typing_practice_title: "음소 타이핑 연습",
            typing_practice_subtitle: "QWERTY 키보드를 사용하여 음소를 입력하세요."
        } }) {
            // 연습을 위한 음소 목록을 정의합니다.
            const phonemes = ["aɪ", "eɪ", "ɔɪ", "i", "ɪ", "ʊ", "u", "e", "ə", "ʌ", "oʊ", "aʊ", "æ", "a", "ɔ", "p", "b", "f", "v", "t", "d", "ʃ", "ʒ", "k", "g", "y", "w", "θ", "ð", "s", "z", "r", "h", "m", "n", "l", "ŋ"];

            // QWERTY 키와 음소 간의 매핑을 정의합니다.
            // 이를 통해 사용자는 QWERTY 키(예: '1')를 눌러 특정 음소(예: 'aɪ')를 입력할 수 있습니다.
            const keyMappings = {
                '1': 'aɪ', '2': 'eɪ', '3': 'ɔɪ',
                'q': 'i', 'w': 'ɪ', 'e': 'ʊ', 'r': 'u',
                'a': 'e', 's': 'ə', 'S': 'ʌ', 'd': 'oʊ', 'f': 'aʊ',
                'z': 'æ', 'x': 'a', 'c': 'ɔ',
                'y': 'p', 'Y': 'b', 'u': 'f', 'U': 'v',
                'i': 't', 'I': 'd', 'o': 'ʃ', 'O': 'ʒ',
                'p': 'k', 'P': 'g', // 'P' 키에 'g' 음소를 매핑합니다.
                '9': 'y', 'h': 'w', 'j': 'θ', 'J': 'ð',
                'k': 's', 'K': 'z', 'l': 'r', ';': 'h',
                'n': 'm', 'm': 'n', ',': 'l', '.': 'ŋ',
                // 사용자 정의 레이아웃에 따라 필요한 만큼 더 많은 키 매핑을 추가합니다.
            };

            // 배열을 섞는 헬퍼 함수입니다.
            const shuffle = (array) => {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            };

            // 컴포넌트의 상태 변수입니다.
            const [shuffledPhonemes, setShuffledPhonemes] = useState(() => shuffle(phonemes));
            const [currentIndex, setCurrentIndex] = useState(0);
            const [input, setInput] = useState("");
            const [feedback, setFeedback] = useState("");
            const currentPhoneme = shuffledPhonemes[currentIndex];
            // 이 base64 문자열은 플레이스홀더입니다. 실제 키보드 레이아웃 이미지를 여기에 추가하세요.
            const keyboardLayoutBase64 = "/images/phoneme-keyboard-layout.png"
    ; // 원래 불완전한 Base64 문자열을 제거했습니다.
            // 포커스 관리를 위한 input 요소에 대한 ref입니다.
            const inputRef = useRef(null);

            // 현재 음소가 변경될 때 input과 feedback을 재설정하는 이펙트 훅입니다.
            // 또한 더 나은 사용자 경험을 위해 input 필드에 자동으로 포커스를 맞춥니다.
            useEffect(() => {
                setInput("");
                setFeedback("");
                if (inputRef.current) {
                    inputRef.current.focus();
                }
            }, [currentIndex, currentPhoneme]);

            // 전역 keydown 이벤트를 처리하는 이펙트 훅입니다.
            useEffect(() => {
                const handleKeyDown = (e) => {
                    // 이벤트가 현재 컴포넌트의 input 요소에서 발생했는지 확인합니다.
                    // 이렇게 하면 다른 input 필드에 대한 백스페이스 동작을 방해하지 않습니다.
                    if (e.target === inputRef.current) {
                        const mappedPhoneme = keyMappings[e.key];

                        if (mappedPhoneme) {
                            e.preventDefault(); // 매핑된 키에 대한 기본 브라우저 동작을 방지합니다.
                            setInput(mappedPhoneme); // 매핑된 음소로 input 상태를 설정합니다.
                            // 매핑된 키로 입력된 경우에도 바로 정답 여부를 확인합니다.
                            if (mappedPhoneme === currentPhoneme) {
                                setFeedback("correct");
                                setTimeout(() => {
                                    const nextIndex = currentIndex + 1;
                                    setCurrentIndex(nextIndex >= shuffledPhonemes.length ? 0 : nextIndex);
                                    if (nextIndex >= shuffledPhonemes.length) {
                                        setShuffledPhonemes(shuffle(phonemes));
                                    }
                                    setInput("");
                                    setFeedback("");
                                }, 200);
                            } else {
                                setFeedback("incorrect");
                            }
                        } else if (e.key === 'Backspace') {
                            e.preventDefault(); // 현재 input 필드의 백스페이스 기본 동작을 방지하고 수동으로 처리합니다.
                            setInput("");
                            setFeedback(""); // 백스페이스 시 피드백도 초기화합니다.
                        }
                    }
                    // e.target이 inputRef.current가 아닌 경우, 이벤트가 정상적으로 전파되도록 합니다.
                };

                // window에 이벤트 리스너를 추가합니다.
                window.addEventListener('keydown', handleKeyDown);

                // 정리 함수: 컴포넌트가 언마운트될 때 이벤트 리스너를 제거합니다.
                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, [currentIndex, shuffledPhonemes, currentPhoneme, phonemes]); // 이펙트의 의존성입니다.

            // 사용자가 직접 입력 필드에 타이핑할 때 호출되는 함수입니다.
            // input 필드가 readOnly이므로 이 함수는 더 이상 직접적인 사용자 입력에 의해 트리거되지 않습니다.
            const handleInputChange = (e) => {
                // 이 함수는 input 필드가 readOnly이므로 직접적인 사용자 입력에는 반응하지 않습니다.
                // 하지만 혹시 모를 상황을 대비하여 기존 로직을 유지합니다.
                const value = e.target.value;
                setInput(value);

                if (value === currentPhoneme) {
                    setFeedback("correct");
                    setTimeout(() => {
                        const nextIndex = currentIndex + 1;
                        setCurrentIndex(nextIndex >= shuffledPhonemes.length ? 0 : nextIndex);
                        if (nextIndex >= shuffledPhonemes.length) {
                            setShuffledPhonemes(shuffle(phonemes));
                        }
                        setInput("");
                        setFeedback("");
                    }, 200);
                } else if (value.length >= currentPhoneme.length) {
                    setFeedback("incorrect");
                } else {
                    setFeedback("");
                }
            };

            return (
                <div className="bg-white flex flex-col items-center justify-center p-8 rounded-2xl shadow-lg">
                    <h2 className="text-3xl font-bold mb-2 text-indigo-800">{strings.typing_practice_title}</h2>
                    <p className="text-gray-600 mb-8">{strings.typing_practice_subtitle}</p>
                    <div className="text-9xl font-mono mb-6 p-4 text-gray-800">{currentPhoneme}</div>
                    <input
                        ref={inputRef} // input 요소에 ref를 연결합니다.
                        type="text"
                        className={`text-2xl border-2 p-2 rounded-md w-64 text-center mb-10 transition-colors duration-200
                            focus:outline-none focus:ring-2 focus:ring-blue-500 ${ // 포커스 스타일 추가
                            feedback === "correct" ? "border-green-500 bg-green-50"
                            : feedback === "incorrect" ? "border-red-500 bg-red-50"
                            : "border-gray-300 bg-white"
                        }`}
                        value={input}
                        onChange={handleInputChange} // 사용자가 직접 입력할 수 있도록 onChange 핸들러를 연결합니다.
                        autoFocus // 컴포넌트 마운트 시 input에 자동으로 포커스를 맞춥니다.
                        readOnly // keyMappings에 없는 키를 눌렀을 때 아무것도 입력되지 않도록 읽기 전용으로 설정합니다.
                    />
                    {/* 사용자에게 피드백 메시지를 표시합니다. */}
                    {feedback === "correct" && <p className="text-green-600 text-lg mb-4">Correct!</p>}
                    {feedback === "incorrect" && <p className="text-red-600 text-lg mb-4">Incorrect. Try again.</p>}

                    <div className="mt-8 max-w-4xl mx-auto">
                        {/* 키보드 레이아웃 이미지에 대한 조건부 렌더링입니다. */}
                        {keyboardLayoutBase64 === "" ? // Base64 문자열이 비어있는지 확인
                            (<div className="w-full text-center p-8 bg-gray-100 rounded-lg">
                                <p className="text-gray-500">키보드 레이아웃 이미지가 여기에 표시됩니다.</p>
                            </div>) :
                            (<img src={keyboardLayoutBase64} alt="Phoneme Keyboard Layout" className="mx-auto rounded-lg shadow-md w-full" />)
                        }
                    </div>
                </div>
            );
        }

        function WordPhonemeTester({ strings }) {
            const [category, setCategory] = useState('Daily');
            const [currentWordData, setCurrentWordData] = useState(null);
            const [userInput, setUserInput] = useState('');
            const [showAnswer, setShowAnswer] = useState(false);
            const [meaningLang, setMeaningLang] = useState('ko');
            const [showMeaning, setShowMeaning] = useState(false);

            const getNewWord = (cat) => {
                const wordList = wordDB[cat];
                if (!wordList || wordList.length === 0) {
                    setCurrentWordData(null); // Handle empty category
                    return;
                }
                const randomEntry = wordList[Math.floor(Math.random() * wordList.length)];
                setCurrentWordData(randomEntry);
                setUserInput('');
                setShowAnswer(false);
                setShowMeaning(false);
            };

            useEffect(() => { getNewWord(category); }, [category]);

            const speakWord = (text) => {
                if (!text || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            };

            if (!currentWordData) return <div>{strings.loading_word}</div>;

            return (
                <div className="bg-white p-8 rounded-2xl shadow-lg w-full">
                    <h2 className="text-3xl font-bold mb-2 text-center text-indigo-800">{strings.tester_title}</h2>
                    <p className="text-gray-600 mb-8 text-center">{strings.tester_subtitle}</p>

                    <div className="mb-6">
                        <label className="block text-center text-gray-700 font-semibold mb-2">{strings.category_label}</label>
                        <select onChange={(e) => setCategory(e.target.value)} value={category} className="w-full bg-gray-100 border-2 border-gray-200 text-gray-700 py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            {Object.keys(wordDB).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                        </select>
                    </div>

                    <div className="mb-6 p-6 bg-blue-50 rounded-xl border-2 border-blue-200 text-center shadow-inner">
                        <label className="block text-blue-800 font-semibold mb-2">{strings.presented_word}</label>
                        <div className="flex items-center justify-center gap-3">
                            <p className="text-4xl font-bold text-blue-900">{currentWordData.word}</p>
                            <button onClick={() => speakWord(currentWordData.word)} className="p-2 rounded-full bg-blue-500 text-white hover:bg-blue-600">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M15.536 8.464a5 5 0 010 7.072M17.657 6.343a9 9 0 010 12.728M9 5v14l-4-4H3a2 2 0 01-2-2V9a2 2 0 012-2h2l4-4z" /></svg>
                            </button>
                            <button onClick={() => {
                                // navigator.clipboard.writeText()는 iframe에서 보안 문제로 작동하지 않을 수 있으므로
                                // document.execCommand('copy')를 사용합니다.
                                const tempInput = document.createElement('textarea');
                                tempInput.value = currentWordData.word;
                                document.body.appendChild(tempInput);
                                tempInput.select();
                                document.execCommand('copy');
                                document.body.removeChild(tempInput);
                                // 복사 완료 피드백을 사용자에게 제공할 수 있습니다 (예: 잠시 메시지 표시)
                            }} className="p-2 rounded-full bg-gray-500 text-white hover:bg-gray-600">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m-4 3h10a2 2 0 012 2v2M4 7h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div className="mb-4">
                        <label htmlFor="phoneme-input" className="block text-gray-700 font-semibold mb-2">{strings.ipa_input_label}</label>
                        <input id="phoneme-input" type="text" className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-lg" placeholder={strings.placeholder} value={userInput} onChange={(e) => setUserInput(e.target.value)} />
                    </div>

                    {showAnswer && <div className="p-4 bg-gray-100 rounded-lg text-center"><p className="text-gray-700">{strings.answer_ipa_label} <span className="font-bold text-lg">{currentWordData.ipa.replace(/j/g, 'y')}</span></p></div>}
                    {showMeaning && <div className="mt-2 p-4 bg-green-50 rounded-lg text-center"><p className="text-green-800">{strings.meaning_label} <span className="font-bold text-lg">{currentWordData.meanings[meaningLang] || currentWordData.meanings.en}</span></p></div>}

                    <div className="mt-6 grid grid-cols-2 gap-4">
                        <button onClick={() => setShowAnswer(true)} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg text-lg shadow-lg transition-all w-full col-span-2">{strings.show_answer_button}</button>
                        <div className="col-span-2 grid grid-cols-2 gap-4">
                            <select onChange={(e) => setMeaningLang(e.target.value)} value={meaningLang} className="bg-gray-100 border-2 border-gray-200 text-gray-700 py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                {Object.keys(uiStrings).map(langKey => <option key={langKey} value={langKey}>{uiStrings[langKey].name}</option>)}
                            </select>
                            <button onClick={() => setShowMeaning(true)} className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg text-lg shadow-lg transition-all">{strings.show_meaning_button}</button>
                        </div>
                        <button onClick={() => getNewWord(category)} className="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg text-lg shadow-lg transition-all col-span-2">{strings.new_word_button}</button>
                    </div>
                </div>
            );
        }

        // =================================================================
        // 4. 전체 페이지 앱 컴포넌트
        // =================================================================
        function App() {
            const [language, setLanguage] = useState('en');
            const strings = uiStrings[language] || uiStrings.en;

            return (
                <Fragment>
                    <header className="bg-white shadow-md sticky top-0 z-10">
                        <nav className="container mx-auto px-6 py-4 flex justify-between items-center">
                            {/* Clickable site title and favicon */}
                            <a href="/" className="flex items-center space-x-2 text-blue-600 hover:text-blue-700 transition-colors duration-200">
                                {/* Favicon image next to the title */}
                                <img
                                    src="/images/phonemekeyboard.com-icon.png"
                                    alt="Keyboard Icon"
                                    className="h-8 w-8 inline-block"
                                />
                                <h1 className="text-2xl font-bold">{strings.title}</h1>
                            </a>
                            <div className="flex items-center space-x-4">
                                <a href="#download" className="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200">{strings.nav_download}</a>
                                <a href="#word-tester" className="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200">{strings.nav_tester}</a>
                                <select onChange={(e) => setLanguage(e.target.value)} value={language} className="bg-gray-100 border-2 border-gray-200 text-gray-700 py-1 px-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    {Object.keys(uiStrings).map(langKey => <option key={langKey} value={langKey}>{uiStrings[langKey].name}</option>)}
                                </select>
                            </div>
                        </nav>
                    </header>

                    <main className="container mx-auto px-6 py-12">
                        <section id="typing-practice" className="mb-24">
                            <PhonemeTypingPractice strings={strings} />
                        </section>

                        <section id="download" className="text-center mb-24">
                            <div className="max-w-3xl mx-auto text-left space-y-8">
                                <h2 className="text-4xl font-bold text-gray-800 text-center">{strings.download_title}</h2>
                                <p className="text-lg text-gray-600">{strings.download_p1}</p>
                                <p className="text-lg text-gray-600">{strings.download_p2}</p>
                                <div>
                                    <h3 className="text-2xl font-semibold text-gray-700 mb-3">{strings.feature_title}</h3>
                                    <ul className="space-y-4">
                                        <li className="flex items-start">
                                            <span className="bg-blue-100 text-blue-600 font-bold rounded-full h-8 w-8 flex items-center justify-center mr-4 mt-1 flex-shrink-0">1</span>
                                            <div>
                                                <h4 className="font-bold text-lg text-gray-800">{strings.feature1_title}</h4>
                                                <p className="text-gray-600">{strings.feature1_desc}</p>
                                            </div>
                                        </li>
                                        <li className="flex items-start">
                                            <span className="bg-blue-100 text-blue-600 font-bold rounded-full h-8 w-8 flex items-center justify-center mr-4 mt-1 flex-shrink-0">2</span>
                                            <div>
                                                <h4 className="font-bold text-lg text-gray-800">{strings.feature2_title}</h4>
                                                <p className="text-gray-600">{strings.feature2_desc}</p>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                                <p className="text-lg text-gray-600 pt-4">{strings.outro}</p>
                            </div>
                            <div className="mt-12 flex justify-center gap-4">
                                <a href="https://drive.google.com/file/d/1O6UiKut1tz0vEwsb3bTchw0ALn84pmq_/view?usp=sharing" target="_blank" rel="noopener noreferrer" className="bg-blue-600 text-white font-bold py-3 px-8 rounded-full hover:bg-blue-700 transition-transform transform hover:scale-105 shadow-lg inline-block">{strings.download_button}</a>
                            </div>
                            <div className="mt-12 max-w-2xl mx-auto text-left">
                                <h3 className="text-2xl font-semibold text-gray-700 mb-4">{strings.install_guide_title}</h3>
                                <ol className="list-decimal list-inside space-y-2 text-gray-600">
                                    <li>{strings.install_step1}</li>
                                    <li>{strings.install_step2}</li>
                                    <li>{strings.install_step3}</li>
                                </ol>
                                <h3 className="text-2xl font-semibold text-gray-700 mt-8 mb-4">{strings.uninstall_guide_title}</h3>
                                <p className="text-gray-600">{strings.uninstall_step1}</p>
                            </div>
                        </section>

                        <section id="word-tester">
                            <WordPhonemeTester strings={strings} />
                        </section>
                    </main>

                    <footer className="bg-gray-800 text-white text-center p-6 mt-12">
                        <p>{strings.footer_text.replace('{year}', new Date().getFullYear())}</p>
                        <p>{strings.contact_email}</p>
                    </footer>
                </Fragment>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
    <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="phonemekeyd" data-description="Support me on Buy me a coffee!" data-message="Thank you for your support! Your contribution helps me create even better tools." data-color="#5F7FFF" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</body>
</html>
